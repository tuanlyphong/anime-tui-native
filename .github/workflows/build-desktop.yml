name: Build desktop releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: bash tool/package_linux_release.sh
            artifact: linux
          - name: Windows
            os: windows-latest
            package: powershell -NoProfile -ExecutionPolicy Bypass -File tool/package_windows_release.ps1
            artifact: windows
          - name: macOS
            os: macos-latest
            package: bash tool/package_macos_release.sh
            artifact: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install engine dependencies
        run: npm install --omit=dev

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze and test
        if: runner.os == 'Linux'
        run: |
          flutter analyze
          flutter test

      - name: Build and package
        shell: bash
        run: ${{ matrix.package }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-tui-native-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
