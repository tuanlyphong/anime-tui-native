name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.50 requires AGP 9, which flutter_inappwebview 6.1.5 does not
      # support yet (fixed only in the 6.2 betas). Stay on the tested 3.47.x.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build and package APK
        run: bash tool/package_android_release.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-tui-native-android
          path: dist/*
          if-no-files-found: error
